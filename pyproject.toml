[project]
name = "jobboard"
version = "1.0.0"
description = "JobBoard - vacancy portal built with Flask"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.0.0",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Login==0.6.3",
    "Flask-WTF==1.2.1",
    "WTForms==3.1.1",
    "Werkzeug==3.0.1",
    "email-validator==2.1.0",
    "python-dotenv==1.0.0",
    "requests==2.31.0",
    "psycopg[binary]==3.2.13",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-flask==1.3.0",
    "gunicorn==21.2.0",
]

[tool.vercel]
entrypoint = "run:app"

[tool.vercel.scripts]
build = "python -c \"from app import create_app, db; app = create_app(); ctx = app.app_context(); ctx.push(); db.create_all()\""
